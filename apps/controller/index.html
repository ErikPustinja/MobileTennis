<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10141c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23ff7a1a%22/%3E%3C/svg%3E" />
    <title>Mobitenis kontroler</title>
  </head>
  <body>
    <main id="app">
      <header class="chip">
        <span id="player" data-testid="player">Mobitenis</span>
        <span id="conn" data-testid="conn">Nije spojeno</span>
      </header>

      <form id="join" class="join" hidden>
        <label>Kod sobe <input id="code" data-testid="code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" /></label>
        <label
          >Mjesto
          <select id="slot">
            <option value="">Bilo koje slobodno</option>
            <option value="0">Igrač 1</option>
            <option value="1">Igrač 2</option>
          </select>
        </label>
        <button type="submit" data-testid="join">Spoji se</button>
      </form>

      <p id="message" class="message" data-testid="message"></p>
      <ul id="warnings" class="warnings" data-testid="warnings"></ul>

      <div class="actions">
        <button id="sensors" type="button" data-testid="sensors">Omogući senzore</button>
        <button id="calibrate" type="button" data-testid="calibrate" disabled>Kalibriraj</button>
        <button id="serve" type="button" data-testid="serve" disabled>Servis</button>
      </div>

      <details id="diag" class="diag">
        <summary>Dijagnostika</summary>
        <pre id="diag-text" data-testid="diag"></pre>
        <button id="record" type="button">Snimi 60 s i izvezi JSON</button>
      </details>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
